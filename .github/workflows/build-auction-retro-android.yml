name: Build Auction Retro Store Android APK

on:
  push:
    branches:
      - main
      - auction-retro-android
    paths:
      - "android/**"
      - "tools/**"
      - "pysidedeploy.spec"
      - "auction_retro_store.pyproject"
      - ".github/workflows/build-auction-retro-android.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip curl autoconf automake libtool pkg-config cmake ninja-build libffi-dev libssl-dev zlib1g-dev libncurses5-dev libncursesw5-dev


      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;35.0.0" "ndk;26.1.10909125"

      - name: Prepare application source and resources
        run: |
          python android/prepare_source.py
          python -m py_compile main.py
          test -f Settings/labels.json
          find Sounds -maxdepth 1 -type f -name '*.wav' | head

      - name: Install PySide deployment tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "PySide6==6.8.3" "buildozer==1.5.0" "Cython==0.29.37" jinja2 pkginfo

      - name: Download official PySide6 Android wheels
        run: |
          mkdir -p android-wheels
          curl --fail --location --retry 3             "https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-6.8.3-6.8.3-cp311-cp311-android_aarch64.whl"             -o android-wheels/PySide6-6.8.3-6.8.3-cp311-cp311-android_aarch64.whl
          curl --fail --location --retry 3             "https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.8.3-6.8.3-cp311-cp311-android_aarch64.whl"             -o android-wheels/shiboken6-6.8.3-6.8.3-cp311-cp311-android_aarch64.whl

      - name: Verify Android wheels
        run: |
          echo "fbb3c4572e2313010a5837635dd629b82622b3049966ec7de937e8aabd6706ff  android-wheels/PySide6-6.8.3-6.8.3-cp311-cp311-android_aarch64.whl" | sha256sum -c -
          echo "dd19a61dc69d097b2283a842bd39295a40f2a1689dce854399edb233e27961a3  android-wheels/shiboken6-6.8.3-6.8.3-cp311-cp311-android_aarch64.whl" | sha256sum -c -

      - name: Patch Android packaging settings
        run: python tools/patch_pyside_android.py

      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          pyside6-android-deploy             --config-file "$GITHUB_WORKSPACE/pysidedeploy.spec"             --wheel-pyside "$GITHUB_WORKSPACE/android-wheels/PySide6-6.8.3-6.8.3-cp311-cp311-android_aarch64.whl"             --wheel-shiboken "$GITHUB_WORKSPACE/android-wheels/shiboken6-6.8.3-6.8.3-cp311-cp311-android_aarch64.whl"             --sdk-path "$ANDROID_HOME"             --ndk-path "$ANDROID_HOME/ndk/26.1.10909125"             --keep-deployment-files             --force             -v

      - name: Collect APK
        if: always()
        run: |
          mkdir -p dist-apk
          find . -type f -name '*.apk' -print -exec cp {} dist-apk/ \;
          ls -lah dist-apk || true

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AuctionRetroStore-Android-v1.0.2-arm64
          path: dist-apk/*.apk
          if-no-files-found: error
